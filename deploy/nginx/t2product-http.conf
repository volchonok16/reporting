# HTTP-only: прод t2product.ru (без SSL)
#
# Ставится: sudo bash deploy/setup-nginx-http.sh --t2product
# DNS → IP сервера: t2product.ru, www.t2product.ru, api.t2product.ru
#           опционально: minio.t2product.ru, minio-console.t2product.ru

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name t2product.ru www.t2product.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        include snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_pass http://127.0.0.1:8000/api/;
    }

    include snippets/voice-proxy.conf;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:5173;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.t2product.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name minio.t2product.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:9000;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name minio-console.t2product.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:9001;
    }
}
