# Voice через reporting-frontend (:5173).
# frontend-nginx уже проксирует:
#   /voice/     → voice-web
#   /voice-api/ → voice-api
#   /_next/     → voice-web
#
# Не ходим напрямую на :3100/:8100 — если voice-web не поднят,
# иначе легко получить 502 или (при старом frontend) SPA reporting в iframe.

location /voice-api/ {
    include snippets/proxy-common.conf;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
    client_max_body_size 0;
    proxy_pass http://127.0.0.1:5173/voice-api/;
}

location /voice/ {
    include snippets/proxy-common.conf;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:5173/voice/;
}

location /_next/ {
    include snippets/proxy-common.conf;
    proxy_pass http://127.0.0.1:5173/_next/;
}
