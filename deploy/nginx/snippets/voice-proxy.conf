# Voice через reporting-frontend (:5173).
# Не include proxy-common целиком для /voice-api/: там уже есть
# client_max_body_size, а Voice нужен свой (большие загрузки).

location /voice-api/ {
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_connect_timeout 60s;
    proxy_pass http://127.0.0.1:5173/voice-api/;
}

location /voice/ {
    include snippets/proxy-common.conf;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_pass http://127.0.0.1:5173/voice/;
}
