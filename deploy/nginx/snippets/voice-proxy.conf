# Voice (карусель): same-origin под reporting.
# UI:  /voice/      → voice-web :3100
# API: /voice-api/  → voice-api :8100
# Ассеты vinext/Next: /_next/ (у reporting frontend — Vite, конфликта нет)

location /voice-api/ {
    include snippets/proxy-common.conf;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
    client_max_body_size 0;
    proxy_pass http://127.0.0.1:8100/;
}

location /voice/ {
    include snippets/proxy-common.conf;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:3100/;
}

location /_next/ {
    include snippets/proxy-common.conf;
    proxy_pass http://127.0.0.1:3100/_next/;
}
