# HTTPS: прод t2product.ru
#
# Сертификат (не в tar):
#   /etc/letsencrypt/live/${CERTBOT_CERT_NAME}/fullchain.pem
#   /etc/letsencrypt/live/${CERTBOT_CERT_NAME}/privkey.pem
# Snippet: deploy/setup-nginx-ssl.sh → snippets/ssl-reporting.conf
#
#   sudo bash deploy/setup-nginx-ssl.sh --t2product
#   sudo bash scripts/offline-deploy.sh TAR --with-ssl --t2product --tunnel

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name
        t2product.ru www.t2product.ru
        api.t2product.ru
        minio.t2product.ru minio-console.t2product.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www → apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.t2product.ru;

    include snippets/ssl-reporting.conf;
    client_max_body_size 50m;

    location /api/ {
        include snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_pass http://127.0.0.1:8000/api/;
    }

    location / {
        return 301 https://t2product.ru$request_uri;
    }
}

# --- UI ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name t2product.ru;

    include snippets/ssl-reporting.conf;
    client_max_body_size 50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        include snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_pass http://127.0.0.1:8000/api/;
    }

    include snippets/voice-proxy.conf;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:5173;
    }
}

# --- API ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.t2product.ru;

    include snippets/ssl-reporting.conf;
    client_max_body_size 50m;

    location / {
        include snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
    }
}

# --- MinIO S3 API ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name minio.t2product.ru;

    include snippets/ssl-reporting.conf;
    client_max_body_size 50m;

    location / {
        include snippets/proxy-common.conf;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:9000;
    }
}

# --- MinIO Console ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name minio-console.t2product.ru;

    include snippets/ssl-reporting.conf;
    client_max_body_size 50m;

    location / {
        include snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:9001;
    }
}
