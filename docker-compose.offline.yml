# Offline / air-gapped deploy: фиксированные имена образов, без pull с Docker Hub.
# Сборка bundle: bash scripts/offline-bundle.sh
# На сервере: bash scripts/offline-deploy.sh /tmp/reporting-offline.tar
#
# Без pull_policy — совместимо с docker-compose 1.29 на закрытых VPS.
# Образы уже должны быть в локальном Docker (docker load).

services:
  postgres:
    image: reporting/postgres:16-alpine

  backend:
    image: reporting/backend:offline
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: reporting/frontend:offline
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_CANVAS_STUDIO_URL: ${CANVAS_STUDIO_PUBLIC_URL:-http://localhost:8080}

  canvas-studio:
    image: reporting/canvas-studio:offline
    build:
      context: ./canvas-studio

  minio:
    image: reporting/minio:2025-04-22

  minio-init:
    image: reporting/minio-mc:2025-04-08
    # Образ уже содержит mc. Не брать entrypoint из docker-compose.yml:
    # тот рассчитан на alpine и качает mc с GitHub (на сервере без сети — exit 127).
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5 &&
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb "local/$$MINIO_BUCKET" --ignore-existing &&
        mc anonymous set none "local/$$MINIO_BUCKET" &&
        mc mb "local/$$MINIO_ATTACHMENTS_BUCKET" --ignore-existing &&
        mc anonymous set none "local/$$MINIO_ATTACHMENTS_BUCKET"

  voice-web:
    image: reporting/voice-web:offline
    build:
      context: ./voice
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${VOICE_API_PUBLIC_URL:-}
        VOICE_BASE_PATH: ${VOICE_BASE_PATH:-/voice}
