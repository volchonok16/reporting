    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="theme-color" content="#2c2c2c" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="/apps/web/styles.css" />
    <!-- importmap -->
    <script>
      // Before the scripts load: the chosen theme, and which skeleton the start screen shows —
      // the editor or the file list to those who will get there, the landing page to a new visitor.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var s = localStorage;
          var theme = s.getItem('cs-theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
          var known = !!s.getItem('cs.offline.user') || s.getItem('cs.mode') === 'local';
          var kind = '';
          if (q.has('present') || q.has('welcome') || q.has('login')) kind = '';
          else if (q.has('file') || q.has('new')) kind = known || q.has('t') ? (q.has('board') ? 'board' : 'editor') : '';
          else if (s.getItem('cs.offline.user') || q.has('local')) kind = 'home';
          else kind = 'landing';
          if (kind) document.documentElement.setAttribute('data-boot', kind);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Shown at once, before the scripts load; the app replaces it. -->
      <div class="boot" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p class="boot-text">Загрузка…</p>
        <!-- Skeletons: the layout that is coming, grey (FEAT: skeleton screens). -->
        <div class="boot-skel boot-editor" aria-hidden="true">
          <div class="bs-top"><i class="bs-pill"></i><i class="bs-pill bs-wide"></i><i class="bs-pill"></i></div>
          <div class="bs-left"><i class="bs-tabs"></i><i class="bs-head"></i><i class="bs-row"></i><hr /><i class="bs-row"></i><i class="bs-row"></i><i class="bs-row"></i><i class="bs-row"></i><i class="bs-row"></i><i class="bs-row"></i></div>
          <div class="bs-canvas"><i class="bs-dock"></i></div>
          <div class="bs-right"><i class="bs-tabs"></i><i class="bs-head"></i><i class="bs-field"></i><i class="bs-field"></i><hr /><i class="bs-head"></i><i class="bs-field"></i><hr /><i class="bs-head"></i><i class="bs-field"></i><i class="bs-field"></i></div>
        </div>
        <div class="boot-skel boot-home" aria-hidden="true">
          <div class="bs-side"><i class="bs-brand"></i><i class="bs-line"></i><i class="bs-search"></i><i class="bs-nav"></i><i class="bs-nav"></i></div>
          <div class="bs-main"><i class="bs-title"></i><div class="bs-grid"><div><i class="bs-thumb"></i><i class="bs-line"></i></div><div><i class="bs-thumb"></i><i class="bs-line"></i></div><div><i class="bs-thumb"></i><i class="bs-line"></i></div><div><i class="bs-thumb"></i><i class="bs-line"></i></div><div><i class="bs-thumb"></i><i class="bs-line"></i></div><div><i class="bs-thumb"></i><i class="bs-line"></i></div></div></div>
        </div>
        <div class="boot-skel boot-landing" aria-hidden="true">
          <div class="bl-header"><i class="bl-logo"></i><div class="bl-nav"><i></i><i></i><i></i><i></i><i></i><i></i></div><i class="bl-cta"></i></div>
          <div class="bl-hero">
            <div class="bl-text"><i class="bl-badge"></i><i class="bl-h1"></i><i class="bl-h1 bl-mid"></i><i class="bl-h1"></i><i class="bl-h1 bl-short"></i><i class="bl-p"></i><i class="bl-p"></i><i class="bl-p bl-short"></i><div class="bl-buttons"><i></i><i></i></div></div>
            <i class="bl-shot"></i>
          </div>
        </div>
      </div>
      <noscript>Для работы редактора нужен JavaScript.</noscript>
    </div>
    <script type="module" src="/apps/web/src/main.ts"></script>
  </body>
