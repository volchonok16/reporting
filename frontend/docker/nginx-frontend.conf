server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Voice — same-origin. voice-web собран с basePath=/voice.
    location /voice-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        client_max_body_size 0;
        proxy_pass http://backend:8000/voice-api/;
    }

    # vinext: HTML/роуты с basePath=/voice, а статика реально лежит на /assets/…
    location /voice/assets/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://voice-web:3000/assets/;
    }

    # Шрифты vinext в HTML preload без basePath
    location /assets/_vinext_fonts/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://voice-web:3000/assets/_vinext_fonts/;
    }

    # Без trailing slash в proxy_pass — URI /voice/... уходит в voice-web как есть.
    location /voice/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /voice;
        proxy_read_timeout 600s;
        proxy_intercept_errors off;
        proxy_hide_header Link;
        proxy_pass http://voice-web:3000;
    }

    # Не отдавать index.html вместо JS (иначе SyntaxError в браузере)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
