server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Voice — тот же origin, что и reporting (один вход, без отдельного хоста).
    # Хостовый nginx достаточно проксировать всё на :5173.
    location /voice-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
        proxy_pass http://voice-api:8000/;
    }

    location /voice/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_pass http://voice-web:3000/;
    }

    # Ассеты vinext/Next (reporting SPA их не использует)
    location /_next/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://voice-web:3000/_next/;
    }

    # Не отдавать index.html вместо JS (иначе SyntaxError в браузере)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
