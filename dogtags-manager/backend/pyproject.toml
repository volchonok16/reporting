[project]
name = "dogtags-manager"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.143.0", "pydantic==2.14.0", "sqlalchemy==2.1.4", "alembic==1.20.0",
  "psycopg[binary]==3.3.6", "celery==5.6.3", "pyarrow==26.0.0", "duckdb==1.5.6",
  "openpyxl==3.1.5", "xlrd==2.0.2", "defusedxml==0.7.1", "numbers-parser==4.22.0", "cramjam==2.14.0",
  "uvicorn==0.54.0", "argon2-cffi==25.1.0", "python-multipart==0.0.32", "python-calamine==0.9.1"
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
