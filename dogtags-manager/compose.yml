name: reporting-dogtags

# Dedicated Dogtags installation. No host ports or shared Reporting database.
services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: dogtags
      POSTGRES_USER: dogtags
      POSTGRES_PASSWORD: ${REPORTING_DOGTAGS_POSTGRES_PASSWORD:?Set a dedicated Dogtags database password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dogtags -d dogtags]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management@sha256:9e9fd21d60f060acc9ecbd847cd1dcb87e6550bdb0297c27e79a40bfe1766ce4
    environment:
      RABBITMQ_DEFAULT_USER: dogtags
      RABBITMQ_DEFAULT_PASS: ${REPORTING_DOGTAGS_RABBITMQ_PASSWORD:?Set a dedicated Dogtags queue password}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [private]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    image: reporting/dogtags-manager:534b82f
    build: .
    command: [python, bootstrap.py]
    environment: &app-environment
      POSTGRES_HOST: postgres
      POSTGRES_DB: dogtags
      POSTGRES_USER: dogtags
      POSTGRES_PASSWORD: ${REPORTING_DOGTAGS_POSTGRES_PASSWORD:?Set a dedicated Dogtags database password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: dogtags
      RABBITMQ_PASSWORD: ${REPORTING_DOGTAGS_RABBITMQ_PASSWORD:?Set a dedicated Dogtags queue password}
      APP_ORIGIN: ${DOGTAGS_MANAGER_ORIGIN:-https://t2product.ru}
      STORAGE_ROOT: /data
      SCRATCH_ROOT: /scratch
      PROCESSING_QUEUE: reporting.dogtags.processing
      DATASET_MEMORY_LIMIT: ${REPORTING_DOGTAGS_DATASET_MEMORY_LIMIT:-1GiB}
      DATASET_THREADS: "1"
    volumes: &app-volumes [artifacts:/data, scratch:/scratch]
    networks: [private]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: "no"

  api:
    image: reporting/dogtags-manager:534b82f
    build: .
    # Only Reporting backend joins gateway; the API has no published ports.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    environment: *app-environment
    volumes: *app-volumes
    networks:
      private:
      gateway:
        aliases: [reporting-dogtags-api]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health'))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    image: reporting/dogtags-manager:534b82f
    build: .
    command: [celery, -A, "app.processing.tasks:celery_app", worker, --concurrency=2, --loglevel=WARNING]
    environment: *app-environment
    volumes: *app-volumes
    networks: [private]
    depends_on:
      init: {condition: service_completed_successfully}
    mem_limit: ${REPORTING_DOGTAGS_WORKER_MEMORY:-4g}
    cpus: ${REPORTING_DOGTAGS_WORKER_CPUS:-2}
    restart: unless-stopped

  dispatcher:
    image: reporting/dogtags-manager:534b82f
    build: .
    command: [python, -m, app.processing.recovery]
    environment: *app-environment
    volumes: *app-volumes
    networks: [private]
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped

networks:
  private:
    internal: true
  gateway:
    name: ${REPORTING_DOGTAGS_NETWORK:-reporting-dogtags-gateway}
    internal: true

volumes:
  postgres-data:
  rabbitmq-data:
  artifacts:
  scratch:
