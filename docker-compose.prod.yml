# Production: приложение на localhost, снаружи — nginx + Let's Encrypt.
#
#   cp .env.production.example .env
#   sudo bash scripts/production.sh

services:
  postgres:
    ports: []

  backend:
    # Voice job executor — один процесс uvicorn (ThreadPoolExecutor не шарится между workers).
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-1}"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://taskatestovaya.ru}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.taskatestovaya.ru}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://taskatestovaya.ru,https://www.taskatestovaya.ru,https://pallink.fun,https://www.pallink.fun}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio.taskatestovaya.ru}
      CAROUSEL_CORS_ORIGINS: ${CAROUSEL_CORS_ORIGINS:-https://taskatestovaya.ru,https://www.taskatestovaya.ru,https://pallink.fun,https://www.pallink.fun,http://localhost:5173,http://localhost:3100}

  frontend:
    build:
      context: ./frontend
      args:
        # Обязательно задайте в .env стенда. Пусто = runtime same-origin / api.<host>
        # my-testing.ru: VITE_API_URL=http://api.my-testing.ru
        # corp: VITE_API_URL=https://api.taskatestovaya.ru
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "127.0.0.1:5173:5173"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  voice-web:
    ports:
      - "127.0.0.1:3100:3000"
    build:
      context: ./voice
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${VOICE_API_PUBLIC_URL:-}
        VOICE_BASE_PATH: ${VOICE_BASE_PATH:-/voice}
    environment:
      VOICE_BASE_PATH: ${VOICE_BASE_PATH:-/voice}
