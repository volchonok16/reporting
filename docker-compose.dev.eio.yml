# EIO workaround (Docker Desktop / virtiofs): без bind-mount исходников.
# Код backend — из образа (--build). Frontend — named volume + scripts/apply-frontend-local.sh
#
# Compose v5: !reset обнуляет volumes без подстановки списка → нужен !override.
services:
  backend:
    ports:
      - "8000:8000"
    volumes: !override
      - ./secrets:/app/secrets:ro
      - reporting_voice_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_VOICE_WEB_PROXY_TARGET: http://voice-web:3000
      VITE_VOICE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci --no-fund --no-audit; fi; npm run dev -- --host 0.0.0.0"
    volumes: !override
      - reporting_frontend_src:/app
      - frontend_node_modules:/app/node_modules

  voice-web:
    ports:
      - "${VOICE_WEB_PORT:-3100}:3000"
    environment:
      VOICE_BASE_PATH: /voice

  minio:
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

volumes:
  reporting_frontend_src:
    external: true
  frontend_node_modules:
  reporting_voice_data:
    external: true
